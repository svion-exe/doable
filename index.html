<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4772fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Doable - private tasks, planner, focus timer and habits">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Doable</title>
<style>
:root{--bg:#fff;--bg2:#f3f4f7;--text:#1b1d21;--sub:#7b808a;--line:#eceef2;--primary:#4772fa;--p3:#d52b24;--p2:#f5a300;--p1:#4772fa;--p0:#a4a9b3;--sheet:#fff;--tint:rgba(71,114,250,.10);--glow:rgba(71,114,250,.45);--fs:1}
[data-theme=dark]{--bg:#17181b;--bg2:#222429;--text:#eceef2;--sub:#8c919b;--line:#2b2e35;--sheet:#1f2125;--p0:#6d7380}
[data-theme=black]{--bg:#000;--bg2:#141416;--text:#eceef2;--sub:#8c919b;--line:#202226;--sheet:#0d0d0f;--p0:#6d7380}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg2);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
input,textarea,select{font-size:16px}
[hidden]{display:none!important}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:relative;max-width:560px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#top{display:flex;align-items:center;gap:2px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;min-height:58px;flex:none}
#top h1{flex:1;margin:0;font-size:21px;font-weight:700;padding-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top input{flex:1;border:0;outline:0;background:var(--bg2);border-radius:12px;height:42px;padding:0 14px}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;flex:none;position:relative}
.ib:active{background:var(--bg2)}
.ib.on{color:var(--primary)}
.txt{color:var(--primary);font-weight:600;padding:10px 8px}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:110px;position:relative}
#tabs{display:flex;border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom);flex:none}
#tabs button{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub)}
#tabs button.on{color:var(--primary);font-weight:600}
#fab{position:absolute;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px var(--glow);z-index:5}
#fab svg{width:26px;height:26px;stroke-width:2.4}
#fab:active{transform:scale(.94)}

/* tasks */
.qa{margin:4px 12px 2px;background:var(--bg2);border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--sub)}
.qa input{flex:1;border:0;background:none;outline:0;height:46px;min-width:0}
.tcard{margin:8px 12px 2px;padding:12px 14px;border-radius:14px;background:var(--tint)}
.tcard b{display:block;font-size:16px}
.tcard span{font-size:13px;color:var(--sub)}
.pr{height:6px;border-radius:3px;background:var(--bg);margin-top:10px;overflow:hidden}
.pr i{display:block;height:100%;background:var(--primary);border-radius:3px;transition:width .4s}
.gh{display:flex;align-items:center;gap:8px;padding:16px 16px 6px;font-size:13px;font-weight:700;color:var(--sub);width:100%;cursor:pointer}
.gh .gc{font-weight:500;opacity:.8}
.gh .chev{width:14px;height:14px;margin-left:auto;transform:rotate(90deg);transition:transform .15s}
.gh.closed .chev{transform:none}
.gact{margin-left:auto;color:var(--primary);font-weight:600;font-size:13px;padding:2px 8px}
.gh .gact+.chev{margin-left:0}
.task{position:relative;overflow:hidden;border-bottom:1px solid var(--line);touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:opacity .25s}
.swbg{position:absolute;top:0;bottom:0;display:flex;align-items:center;color:#fff;padding:0 22px;width:50%}
.swbg.l{left:0;background:#2f9e44;justify-content:flex-start}
.swbg.r{right:0;background:var(--primary);justify-content:flex-end}
.tin{position:relative;display:flex;gap:13px;padding:11px 16px;align-items:flex-start;background:var(--bg);transition:transform .2s}
.tin.drag{transition:none}
.compact .tin{padding:7px 16px}
.chk{position:relative;flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--p0);display:grid;place-items:center;margin-top:1px;transition:background .15s,border-color .15s}
.chk::before{content:'';position:absolute;inset:-12px}
.chk svg{width:14px;height:14px;stroke-width:3.2;opacity:0;color:#fff}
.chk.p1{border-color:var(--p1);background:rgba(71,114,250,.14)}
.chk.p2{border-color:var(--p2);background:rgba(245,163,0,.16)}
.chk.p3{border-color:var(--p3);background:rgba(213,43,36,.13)}
.chk.on{background:var(--p0)!important;border-color:var(--p0)!important}
.chk.on svg{opacity:1}
.task.sel .tin{background:var(--tint)}
.task.sel .chk{background:var(--primary)!important;border-color:var(--primary)!important}
.task.sel .chk svg{opacity:1}
.task.fading{opacity:.35}
.task.fading .ttitle,.task.done .ttitle{text-decoration:line-through}
.task.done .ttitle{color:var(--sub)}
.tbody{flex:1;min-width:0}
.ttitle{word-break:break-word;font-size:calc(16px*var(--fs))}
.tmeta{display:flex;flex-wrap:wrap;gap:3px 10px;align-items:center;font-size:calc(12.5px*var(--fs));color:var(--sub);margin-top:3px}
.tmeta .ic{width:13px;height:13px;stroke-width:2.2}
.tmeta span{display:inline-flex;align-items:center;gap:3px}
.tmeta .late{color:var(--p3)}.tmeta .today{color:var(--primary)}
.tmeta .tg{color:var(--primary);opacity:.85}
.tmeta .ls i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tmeta .star{color:var(--p2)}
.tmeta .star .ic{fill:currentColor}
.tbar{height:3px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden;max-width:120px}
.tbar i{display:block;height:100%;background:var(--primary)}
.empty{text-align:center;color:var(--sub);padding:70px 30px}
.empty .ic{width:56px;height:56px;stroke-width:1.4;opacity:.5;margin-bottom:10px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.mx{margin:10px 12px;border-radius:14px;background:var(--bg2);overflow:hidden}
.mx>header{display:flex;align-items:baseline;gap:8px;padding:11px 14px 8px;font-weight:700}
.mx>header small{font-weight:500;color:var(--sub);font-size:12.5px}
.mx>header em{margin-left:auto;font-style:normal;color:var(--sub);font-weight:500;font-size:13px}
.mx .task{border-color:var(--line)}
.mx .tin{background:var(--bg2)}
.mx .empty{padding:14px;font-size:13px}
.mx .mxe{padding:2px 14px 14px;color:var(--sub);font-size:13px}

/* layers / sheets */
.layer{position:fixed;inset:0;visibility:hidden}
.layer.on{visibility:visible}
#L1{z-index:50}#LS{z-index:55}#L2{z-index:60}#L3{z-index:70}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .2s}
.layer.show .backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--sheet);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.8,.2,1);max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);overflow:hidden}
.layer.show .sheet{transform:none}
.sheet.full{height:94vh;height:94dvh}
.sheet.center{bottom:auto;top:50%;width:calc(100% - 40px);max-width:400px;border-radius:18px;transform:translateY(-46%) scale(.96);opacity:0;transition:transform .2s,opacity .2s}
.layer.show .sheet.center{transform:translateY(-50%);opacity:1}
.sh-head{display:flex;align-items:center;padding:10px 8px 4px;flex:none}
.sh-head .sp{flex:1}
.sh-head h2{margin:0;font-size:18px;padding-left:6px;flex:1}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding-bottom:24px}
.d-title{display:flex;gap:13px;padding:6px 18px 12px;align-items:flex-start}
.d-title .chk{margin-top:6px}
.d-title textarea{flex:1;border:0;outline:0;background:none;resize:none;font-size:20px;font-weight:600;line-height:1.3;padding:2px 0;overflow:hidden}
.dr{padding:13px 18px;border-top:1px solid var(--line)}
.dr .lbl{font-size:12.5px;color:var(--sub);font-weight:600;margin-bottom:8px}
.dr .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dr input[type=date],.dr input[type=time],.dr select{background:var(--bg2);border:0;border-radius:10px;padding:9px 10px;outline:0;min-width:0;color-scheme:light dark}
.dr select{max-width:100%}
.chip{padding:7px 12px;border-radius:999px;background:var(--bg2);font-size:14px}
.chip.on{background:var(--tint);color:var(--primary);font-weight:600}
.chip.x{display:inline-flex;gap:6px;align-items:center;background:var(--tint);color:var(--primary)}
.chip.x .ic{width:13px;height:13px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:9px 0;border-radius:10px;background:var(--bg2);display:flex;gap:6px;justify-content:center;align-items:center;font-size:14px;text-align:center}
.seg button .ic{width:16px;height:16px}
.seg .s3.on{background:rgba(213,43,36,.14);color:var(--p3);font-weight:600}
.seg .s2.on{background:rgba(245,163,0,.18);color:#c78500;font-weight:600}
.seg .s1.on{background:var(--tint);color:var(--primary);font-weight:600}
.seg .s0.on{background:var(--line);font-weight:600}
.seg .on:not(.s0):not(.s1):not(.s2):not(.s3){background:var(--tint);color:var(--primary);font-weight:600}
.sub{display:flex;align-items:center;gap:12px;padding:5px 0}
.sub input.sub-t{flex:1;border:0;background:none;outline:0;padding:6px 0;min-width:0}
.sub.done input.sub-t{text-decoration:line-through;color:var(--sub)}
.sub .x{color:var(--sub);width:30px;height:30px;display:grid;place-items:center}
.sub .x .ic{width:16px;height:16px}
.sub .chk{width:19px;height:19px;border-radius:6px}
.sub .chk svg{width:12px;height:12px}
.dr input.plain,.dr textarea{width:100%;border:0;outline:0;background:none;padding:6px 0;resize:none}
.dr textarea{min-height:90px;line-height:1.45}
.dbtn2{margin:16px 18px 0;padding:13px;border-radius:12px;background:rgba(213,43,36,.1);color:var(--p3);font-weight:600;text-align:center;width:calc(100% - 36px)}
.focusbtn{display:flex;align-items:center;gap:10px;margin:0 18px 12px;padding:11px 14px;border-radius:12px;background:var(--tint);color:var(--primary);font-weight:600;width:calc(100% - 36px)}
.focusbtn span{margin-left:auto;font-weight:500;font-size:13px;opacity:.85}

/* add sheet */
.add .sh-body{padding:16px 16px 10px;overflow:visible}
.add textarea{width:100%;border:0;outline:0;background:none;resize:none;font-size:18px;min-height:56px;line-height:1.35}
.add .hint{font-size:12.5px;color:var(--sub);margin:2px 0 10px;min-height:17px}
.add .hint b{color:var(--primary);font-weight:600}
.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{position:relative;display:inline-flex;gap:6px;align-items:center;padding:8px 12px;border-radius:999px;background:var(--bg2);font-size:14px;max-width:48vw;flex:none}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill .ic{width:16px;height:16px}
.pill.on{background:var(--tint);color:var(--primary);font-weight:600}
.pill input,.pill select{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.pill i{width:9px;height:9px;border-radius:50%;display:inline-block}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.sendrow{display:flex;align-items:flex-end;gap:8px;margin-top:14px}
.sendrow .scroller{flex:1;min-width:0}
.send{width:46px;height:46px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}
.send svg{stroke-width:2.6}
.mic{width:46px;height:46px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;flex:none}
.mic.rec{background:var(--p3);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}

/* menu + dialog */
.mi{display:flex;align-items:center;gap:14px;padding:15px 20px;width:100%;font-size:16px}
.mi:active{background:var(--bg2)}
.mi .ic{color:var(--sub)}
.mi.danger,.mi.danger .ic{color:var(--p3)}
.mi .ck{margin-left:auto;color:var(--primary)}
.mt{padding:16px 20px 6px;font-size:13px;font-weight:700;color:var(--sub)}
.dlg{padding:22px 20px 14px}
.dlg h3{margin:0 0 14px;font-size:18px}
.dlg input[type=text],.dlg input[type=number],.dlg input[type=password],.dlg select{width:100%;border:0;background:var(--bg2);border-radius:10px;padding:12px;outline:0}
.dlg p{margin:0;color:var(--sub)}
.dlg .lbl{font-size:12.5px;color:var(--sub);font-weight:600;margin:14px 0 6px}
.dbtn{display:flex;justify-content:flex-end;gap:6px;margin-top:18px}
.dbtn button{padding:10px 16px;border-radius:10px;font-weight:600;color:var(--sub)}
.dbtn .prim{color:var(--primary)}.dbtn .danger{color:var(--p3)}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.swb{width:32px;height:32px;border-radius:50%;border:3px solid transparent;background-clip:padding-box;outline:2px solid transparent}
.swb.on{outline-color:var(--text)}
.emo{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.emo button{width:40px;height:40px;border-radius:12px;background:var(--bg2);font-size:21px;text-align:center}
.emo button.on{background:var(--tint);outline:2px solid var(--primary)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.frow input,.frow select{width:96px!important;text-align:center}
.wd{display:flex;gap:6px;margin-top:6px}
.wd button{flex:1;height:38px;border-radius:50%;background:var(--bg2);text-align:center;font-size:13px;font-weight:600}
.wd button.on{background:var(--primary);color:#fff}

/* drawer */
#drawer{position:fixed;inset:0;z-index:40;visibility:hidden}
#drawer.on{visibility:visible}
#drawer .panel{position:absolute;left:0;top:0;bottom:0;width:min(86vw,330px);background:var(--bg);transform:translateX(-100%);transition:transform .24s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 0 30px}
#drawer.show .panel{transform:none}
#drawer.show .backdrop{opacity:1}
.brand{display:flex;align-items:center;gap:10px;padding:4px 18px 14px;font-size:20px;font-weight:800}
.brand i{width:32px;height:32px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center}
.brand i svg{width:19px;height:19px;stroke-width:3}
.di{display:flex;align-items:center;gap:14px;padding:11px 18px;width:100%}
.di .dic{display:grid;place-items:center;width:24px;color:var(--sub)}
.di .dic .ic{width:21px;height:21px}
.di .dot{width:11px;height:11px;border-radius:50%}
.di .n{margin-left:auto;font-size:13px;color:var(--sub)}
.di.on{background:var(--tint);color:var(--primary);font-weight:600}
.di.on .dic{color:var(--primary)}
.dh{display:flex;align-items:center;padding:16px 18px 4px;font-size:13px;font-weight:700;color:var(--sub)}
.dh button{margin-left:auto;color:var(--primary);display:grid;place-items:center}
.dh .ic{width:18px;height:18px}
.dsep{height:1px;background:var(--line);margin:12px 18px}

/* calendar */
.cal{padding:0 8px}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-h div{text-align:center;font-size:12px;color:var(--sub);padding:6px 0}
.cd{height:54px;display:flex;flex-direction:column;align-items:center;padding-top:5px;gap:3px;border-radius:12px;position:relative}
.cd b{width:30px;height:30px;display:grid;place-items:center;font-weight:500;border-radius:50%;font-size:15px}
.cd.oth b{color:var(--sub);opacity:.5}
.cd.tdy b{color:var(--primary);font-weight:700}
.cd.sel b{background:var(--primary);color:#fff;font-weight:700}
.dots{display:flex;gap:3px;height:6px;align-items:center}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--p0)}
.dots i.d3{background:var(--p3)}.dots i.d2{background:var(--p2)}.dots i.d1{background:var(--p1)}
.cal-day{margin-top:8px;border-top:6px solid var(--bg2)}
.cal-day .gh{padding-top:14px}
.tl-any{padding:4px 0 8px;border-bottom:6px solid var(--bg2)}
.tl{position:relative;margin:6px 8px 0 0}
.tl .hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);height:0}
.tl .hr span{position:absolute;left:0;top:-8px;width:46px;text-align:right;padding-right:8px;font-size:11px;color:var(--sub);background:var(--bg)}
.tl .blk{position:absolute;border-radius:9px;padding:4px 8px 4px 8px;overflow:hidden;font-size:13px;line-height:1.25;border-left:4px solid;display:flex;gap:6px;align-items:flex-start}
.tl .blk b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis}
.tl .blk small{display:block;opacity:.75;font-size:11.5px}
.tl .blk.done{opacity:.5}
.tl .blk.done b{text-decoration:line-through}
.tl .now{position:absolute;left:44px;right:0;height:0;border-top:2px solid var(--p3);z-index:3;pointer-events:none}
.tl .now::before{content:'';position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--p3)}

/* focus */
.focus{display:flex;flex-direction:column;align-items:center;padding:6px 20px}
.modes{display:flex;background:var(--bg2);border-radius:12px;padding:3px;gap:2px;width:100%;max-width:340px}
.modes button{flex:1;padding:8px 0;border-radius:10px;font-size:13.5px;text-align:center;color:var(--sub)}
.modes button.on{background:var(--bg);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ring{position:relative;width:min(72vw,280px);aspect-ratio:1;margin:26px 0 18px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--bg2)}
.ring .fg{stroke:var(--primary);stroke-linecap:round;transition:stroke-dashoffset .4s linear}
.ring.brk .fg{stroke:#2f9e44}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .t b{font-size:54px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:1px}
.ring .t span{color:var(--sub);font-size:14px}
.ctrls{display:flex;align-items:center;gap:26px;margin-bottom:22px}
.ctrls .sm{width:48px;height:48px;border-radius:50%;background:var(--bg2);display:grid;place-items:center}
.ctrls .go{width:72px;height:72px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px var(--glow)}
.ctrls .go svg{width:30px;height:30px}
.ftask{width:100%;max-width:340px;background:var(--bg2);border-radius:12px;padding:0 12px;display:flex;align-items:center;gap:8px;color:var(--sub);margin-bottom:14px}
.ftask select{flex:1;border:0;background:none;outline:0;height:46px;min-width:0;color:var(--text)}
.amb{width:100%;max-width:340px;margin-bottom:20px}
.amb .lbl{font-size:12.5px;color:var(--sub);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.amb .lbl .ic{width:15px;height:15px}
.stats{width:100%;max-width:340px}
.stats .big{display:flex;gap:10px}
.stats .big div{flex:1;background:var(--bg2);border-radius:14px;padding:12px 14px}
.stats .big b{font-size:22px;display:block}
.stats .big span{font-size:12.5px;color:var(--sub)}
.bars{display:flex;gap:8px;align-items:flex-end;height:80px;margin-top:16px}

.bars i{width:100%;background:var(--primary);border-radius:5px 5px 2px 2px;min-height:3px;opacity:.85}

.hb-main span{font-size:13px;color:var(--sub)}
.hb-check{position:relative;width:44px;height:44px;border-radius:50%;border:2.5px solid var(--p0);display:grid;place-items:center;color:transparent;flex:none;transition:.15s;font-size:12px;font-weight:700}
.hb-check.part{color:var(--text)}
.hb-check.on{color:#fff;border-color:transparent}
.hb-week{display:flex;gap:6px;margin-top:12px}
.hd{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--sub);padding:2px 0;text-align:center}
.hd i{width:100%;max-width:34px;aspect-ratio:1;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.hd.off{opacity:.35}
.hd.on i{color:#fff}
.hd i svg{width:14px;height:14px;stroke-width:3.2;opacity:0}
.hd.on i svg{opacity:1}
.hd.t span{color:var(--primary);font-weight:700}
.hstat{display:flex;gap:10px;padding:6px 18px 10px}
.hstat div{flex:1;background:var(--bg2);border-radius:14px;padding:11px 12px}
.hstat b{display:block;font-size:20px}
.hstat span{font-size:12px;color:var(--sub)}
.hmonth{padding:0 14px}
.hmonth .cd{height:46px}
.hmonth .cd b{font-size:14px}
.hmonth .cd.hon b{color:#fff}
.hmonth .cd.off b{opacity:.35}

.in-card{margin:10px 14px;background:var(--bg2);border-radius:16px;padding:14px}
.in-card h4{margin:0 0 10px;font-size:14px;color:var(--sub);font-weight:700}
.lvl{display:flex;align-items:center;gap:14px}
.lvl .badge{width:56px;height:56px;border-radius:18px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;flex:none}
.lvl .info{flex:1;min-width:0}
.lvl b{display:block;font-size:17px}
.lvl span{font-size:13px;color:var(--sub)}
.goalrow{display:flex;align-items:center;gap:16px}
.goalrow svg{width:84px;height:84px;transform:rotate(-90deg);flex:none}
.goalrow circle{fill:none;stroke-width:8}
.goalrow .gbg{stroke:var(--bg)}
.goalrow .gfg{stroke:var(--primary);stroke-linecap:round}
.goalrow b{font-size:22px;display:block}
.goalrow span{font-size:13px;color:var(--sub)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 14px}

.kpis b{display:block;font-size:22px}
.kpis span{font-size:12.5px;color:var(--sub)}

.heat i.h2{background:color-mix(in srgb,var(--primary) 55%,var(--bg))}
.heat i.h3{background:color-mix(in srgb,var(--primary) 80%,var(--bg))}

.sg{padding:6px 0 4px}

.srow{display:flex;align-items:center;gap:12px;padding:12px 18px;width:100%;min-height:50px}

.tog.on{background:var(--primary)}
.tog.on::after{left:21px}
.sr-seg{padding:4px 18px 10px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:10px;background:var(--bg2);text-align:center;font-size:18px;font-weight:600}

/* selection */
#sel{display:none}

/* lock */
#lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px}
#lock .lk{width:56px;height:56px;border-radius:18px;background:var(--primary);color:#fff;display:grid;place-items:center}
#lock .lk svg{width:28px;height:28px}
#lock h2{margin:0;font-size:20px}
#lock .pd{display:flex;gap:14px;height:16px}
#lock .pd i{width:14px;height:14px;border-radius:50%;border:2px solid var(--p0);transition:.12s}

#lock .pd.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#lock .kp{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
#lock .kp button{height:72px;border-radius:50%;background:var(--bg2);font-size:26px;text-align:center;display:grid;place-items:center}
#lock .kp button:active{background:var(--tint)}
#lock .kp .ghost{background:none}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:#2b2d33;color:#fff;border-radius:12px;padding:12px 16px;display:flex;gap:16px;align-items:center;z-index:90;max-width:92vw;transition:.2s;pointer-events:none;font-size:14.5px;box-shadow:0 6px 24px rgba(0,0,0,.3)}

#toast button{color:#8fb0ff;font-weight:700;white-space:nowrap}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100;color:var(--sub)}
.conf{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.conf i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:fall 1.7s ease-in forwards}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const KEY='doable:v2',OLDKEY='doable:v1';

  async get(k){

const VIEW_NAMES={today:'Today',tomorrow:'Tomorrow',week:'Next 7 Days',all:'All',done:'Completed',priority:'High priority',star:'Starred',nodate:'No date',trash:'Trash'};
function viewTitle(){
  const v=ui.view;
  if(v.startsWith('list:')){const l=getList(v.slice(5));return l?l.name:'List'}
  if(v.startsWith('tag:'))return '#'+v.slice(4);
  return VIEW_NAMES[v]||'Tasks';
}
function matchView(t,v){
  const td=today();
  if(v==='today')return !!t.due&&t.due<=td;
  if(v==='tomorrow')return t.due===addDays(td,1);
  if(v==='week')return !!t.due&&t.due<=addDays(td,6);
  if(v==='priority')return t.priority===3;
  if(v==='star')return !!t.star;
  if(v==='nodate')return !t.due;
  if(v==='all'||v==='done'||v==='trash')return true;
  if(v.startsWith('list:'))return t.listId===v.slice(5);
  if(v.startsWith('tag:'))return t.tags.includes(v.slice(4));
  return true;
}
const countView=v=>S.tasks.filter(t=>!t.done&&matchView(t,v)).length;

/* ============ quick-add parser ============ */
const WD={sun:0,sunday:0,mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,wednesday:3,thu:4,thur:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6};
const MO={jan:0,january:0,feb:1,february:1,mar:2,march:2,apr:3,april:3,may:4,jun:5,june:5,jul:6,july:6,aug:7,august:7,sep:8,sept:8,september:8,oct:9,october:9,nov:10,november:10,dec:11,december:11};
const WDRE='(?:sunday|sun|monday|mon|tuesday|tues|tue|wednesday|wed|thursday|thurs|thur|thu|friday|fri|saturday|sat)';
function parseQuick(text){
  let s=' '+text+' ',due=null,time=null,priority=null,repeat='',dur=null,listId=null;const tags=[];
  const td=today();
  s=s.replace(/\s#([\w-]+)(?=\s)/g,(_,t)=>{tags.push(t.toLowerCase());return ' '});
  s=s.replace(/\s@([\w-]+)(?=\s)/,(m,n)=>{
    const q=n.toLowerCase(),slug=l=>l.name.toLowerCase().replace(/\s+/g,'-');
    const l=S.lists.find(x=>slug(x)===q)||S.lists.find(x=>slug(x).startsWith(q));
    if(l){listId=l.id;return ' '}return m});
  s=s.replace(/\s!(high|medium|med|low|none|h|m|l|3|2|1|0)(?=\s)/i,(_,p)=>{priority={high:3,h:3,3:3,medium:2,med:2,m:2,2:2,low:1,l:1,1:1,none:0,0:0}[p.toLowerCase()];return ' '});
  if(priority==null)s=s.replace(/\sp([1-4])(?=\s)/i,(_,p)=>{priority=4-(+p);return ' '});
  s=s.replace(/\sfor (\d+(?:\.\d+)?)\s?(minutes|minute|mins|min|m|hours|hour|hrs|hr|h)(?=\s)/i,(_,n,u)=>{dur=Math.max(1,Math.round(+n*(/^h/i.test(u)?60:1)));return ' '});
  // repeat
  s=s.replace(/\severy (day|weekday|week|month|year)(?=\s)/i,(_,u)=>{repeat={day:'daily',weekday:'weekdays',week:'weekly',month:'monthly',year:'yearly'}[u.toLowerCase()];return ' '});
  if(!repeat){const m=s.match(/\severy (\d+) (day|week|month|year)s?(?=\s)/i);if(m){repeat=m[1]+':'+m[2].toLowerCase();s=s.replace(m[0],' ')}}
  if(!repeat){
    const re=new RegExp('\\severy\\s+('+WDRE+'(?:(?:\\s*,\\s*|\\s+and\\s+|\\s+)'+WDRE+')*)(?=\\s)','i');
    const m=s.match(re);
    if(m){const ds=[...new Set((m[1].match(/[a-z]+/gi)||[]).map(w=>WD[w.toLowerCase()]).filter(x=>x!=null))].sort();
      if(ds.length){repeat='dow:'+ds.join(',');s=s.replace(m[0],' ')}}
  }
  if(!repeat)s=s.replace(/\s(daily|weekly|monthly|yearly)(?=\s)/i,(_,u)=>{repeat=u.toLowerCase();return ' '});
  s=s.replace(/\stonight(?=\s)/i,()=>{time='20:00';due=td;return ' '});
  if(!time)s=s.replace(/\s(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s?(am|pm)(?=\s)/i,(all,h,mi,ap)=>{
    h=+h;if(h<1||h>12||(mi&&+mi>59))return all;h=h%12;if(ap.toLowerCase()==='pm')h+=12;time=pad(h)+':'+pad(mi||0);return ' '});
  if(!time)s=s.replace(/\s(?:at\s+)?([01]?\d|2[0-3]):([0-5]\d)(?=\s)/,(_,h,mi)=>{time=pad(+h)+':'+mi;return ' '});
  if(!time)s=s.replace(/\snoon(?=\s)/i,()=>{time='12:00';return ' '});
  const rules=[
    [/\s(?:today)(?=\s)/i,()=>td],
    [/\s(?:tomorrow|tmr|tmrw)(?=\s)/i,()=>addDays(td,1)],
    [/\s(?:next week)(?=\s)/i,()=>addDays(td,7)],
    [/\s(?:next month)(?=\s)/i,()=>addMonths(td,1)],
    [/\s(?:this )?weekend(?=\s)/i,()=>addDays(td,((6-parseYmd(td).getDay()+7)%7)||7)],
    [/\sin (\d+) (day|days|week|weeks|month|months)(?=\s)/i,(n,u)=>{n=+n;u=u.toLowerCase();if(u.startsWith('day'))return addDays(td,n);if(u.startsWith('week'))return addDays(td,n*7);return addMonths(td,n)}],
    [/\s(\d{4}-\d{2}-\d{2})(?=\s)/,d=>d],
    [new RegExp('\\s(?:on\\s+)?('+Object.keys(MO).join('|')+')\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?(?=\\s)','i'),(m,d)=>{
      d=+d;if(d<1||d>31)return null;const y=new Date().getFullYear();let dt=new Date(y,MO[m.toLowerCase()],d);if(ymd(dt)<td)dt=new Date(y+1,MO[m.toLowerCase()],d);return ymd(dt)}],
    [new RegExp('\\s(?:on\\s+|next\\s+)?('+WDRE+')(?=\\s)','i'),w=>{
      const cur=parseYmd(td).getDay();return addDays(td,((WD[w.toLowerCase()]-cur+7)%7)||7)}]
  ];
  for(const [re,fn] of rules){
    if(due)break;
    const m=s.match(re);
    if(m){const r=fn(...m.slice(1));if(r){due=r;s=s.replace(re,' ')}}
  }
  if(!due&&repeat){
    if(repeat.startsWith('dow:')){const set=repeat.slice(4).split(',').map(Number);let d=td,g=0;while(!set.includes(parseYmd(d).getDay())&&g++<7)d=addDays(d,1);due=d}
    else due=td;
  }
  if(time&&!due)due=time>nowHM()?td:addDays(td,1);
  return {title:s.replace(/\s+/g,' ').trim(),due,time,priority,tags,repeat,dur,listId};
}

/* ============ recurrence ============ */
function stepDate(d,rep){
  if(rep.startsWith('dow:')){
    let set=rep.slice(4).split(',').map(Number).filter(x=>x>=0&&x<=6);if(!set.length)set=[parseYmd(d).getDay()];
    let n=d,g=0;do{n=addDays(n,1)}while(!set.includes(parseYmd(n).getDay())&&g++<8);return n;
  }
  let n=1,u=rep;
  if(rep.includes(':')){const [a,b]=rep.split(':');n=Math.max(1,+a||1);u=b}
  u=({daily:'day',weekly:'week',monthly:'month',yearly:'year'})[u]||u;
  if(u==='weekdays'){let x=d;do{x=addDays(x,1)}while([0,6].includes(parseYmd(x).getDay()));return x}
  if(u==='week')return addDays(d,7*n);
  if(u==='month')return addMonths(d,n);
  if(u==='year')return addMonths(d,12*n);
  return addDays(d,n);
}
function nextDue(base,rep){let n=stepDate(base,rep),g=0;while(n<today()&&g++<800)n=stepDate(n,rep);return n}
function repLabel(rep){
  if(!rep)return 'Never';
  const m={daily:'Every day',weekdays:'Every weekday',weekly:'Every week',monthly:'Every month',yearly:'Every year'};
  if(m[rep])return m[rep];
  if(rep.startsWith('dow:'))return 'Every '+rep.slice(4).split(',').map(i=>DOW[+i]).join(', ');
  const [n,u]=rep.split(':');return +n===1?'Every '+u:'Every '+n+' '+u+'s';
}

/* ============ layers + Android back button ============ */
const hist=[];let ignorePop=0;
function hPush(id){hist.push(id);try{history.pushState({h:hist.length},'')}catch(e){}}
function hPop(id){const i=hist.lastIndexOf(id);if(i<0)return;hist.splice(i,1);ignorePop++;try{history.back()}catch(e){ignorePop--}}
window.addEventListener('popstate',()=>{
  if(ignorePop>0){ignorePop--;return}
  const id=hist.pop();if(!id)return;
  if(id==='drawer')closeDrawer(true);
  else if(id==='L1'&&ui.detailId)closeDetail(true);
  else if(id==='L1'){hideLayer('L1',true);ui.qa=null}
  else if(id==='LS'){hideLayer('LS',true);ui.hd=null}
  else if(id==='sel'){ui.sel=null;render()}
  else hideLayer(id,true);
});
function showLayer(id,html,cls=''){
  const r=$('#'+id);
  r.innerHTML='<div class="backdrop" data-act="bg" data-l="'+id+'"></div><div class="sheet '+cls+'">'+html+'</div>';
  r.classList.add('on');void r.offsetWidth;r.classList.add('show');
  if(!r.dataset.h){r.dataset.h='1';hPush(id)}
}
function hideLayer(id,fromPop){
  const r=$('#'+id);r.classList.remove('show');
  if(r.dataset.h){delete r.dataset.h;if(!fromPop)hPop(id)}
  setTimeout(()=>{if(!r.classList.contains('show')){r.classList.remove('on');r.innerHTML=''}},230);
}

function hexRgb(h){const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255]}
function applyTheme(){
  const st=S.settings,t=st.theme;
  const dark=t==='dark'||t==='black'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  const root=document.documentElement;
  root.dataset.theme=t==='black'?'black':dark?'dark':'light';
  const [r,g,b]=hexRgb(st.accent||'#4772fa');
  root.style.setProperty('--primary',st.accent);
  root.style.setProperty('--tint','rgba('+r+','+g+','+b+','+(dark?.2:.1)+')');
  root.style.setProperty('--glow','rgba('+r+','+g+','+b+',.45)');

  $('#app').classList.toggle('compact',!!st.compact);
  const m=$('meta[name=theme-color]');if(m)m.content=t==='black'?'#000000':dark?'#17181b':'#ffffff';
}

/* ============ tasks: rendering ============ */
function taskRow(t,showList){
  const meta=[];
  if(t.star)meta.push('<span class="star">'+ic('star')+'</span>');
  if(t.due){const cls=isLate(t)?'late':(t.due===today()?'today':'');meta.push('<span class="'+cls+'">'+esc(dueText(t))+'</span>')}
  if(t.dur)meta.push('<span>'+ic('clock')+durText(t.dur)+'</span>');
  if(t.repeat)meta.push('<span>'+ic('repeat')+'</span>');
  if(t.remind!=null&&t.due)meta.push('<span>'+ic('bell')+'</span>');
  if(t.subtasks.length)meta.push('<span>'+ic('sub')+t.subtasks.filter(s=>s.done).length+'/'+t.subtasks.length+'</span>');
  if(t.notes)meta.push('<span>'+ic('note')+'</span>');
  t.tags.forEach(g=>meta.push('<span class="tg">#'+esc(g)+'</span>'));
  const l=getList(t.listId);
  if(showList&&l)meta.push('<span class="ls"><i style="background:'+l.color+'"></i>'+esc(l.name)+'</span>');
  const sp=t.subtasks.length?Math.round(t.subtasks.filter(s=>s.done).length/t.subtasks.length*100):-1;
  const sel=ui.sel&&ui.sel.has(t.id);
  return '<div class="task '+(t.done?'done ':'')+(sel?'sel':'')+'" data-id="'+t.id+'"><div class="swbg l">'+ic('check')+'</div><div class="swbg r">'+ic('cal')+'</div><div class="tin"><button class="chk p'+t.priority+' '+(t.done?'on':'')+'" data-act="toggle" data-id="'+t.id+'" aria-label="Complete">'+ic('check')+'</button><div class="tbody" data-act="open" data-id="'+t.id+'"><div class="ttitle">'+esc(t.title)+'</div>'+(meta.length?'<div class="tmeta">'+meta.join('')+'</div>':'')+(sp>=0&&!t.done?'<div class="tbar"><i style="width:'+sp+'%"></i></div>':'')+'</div></div></div>';
}
function trashRow(t){
  return '<div class="task done" data-id="'+t.id+'"><div class="tin"><button class="chk on" data-act="trash-open" data-id="'+t.id+'" aria-label="Restore">'+ic('reset')+'</button><div class="tbody" data-act="trash-open" data-id="'+t.id+'"><div class="ttitle">'+esc(t.title)+'</div><div class="tmeta"><span>Deleted '+esc(dayLabel(ymd(new Date(t.deletedAt||Date.now()))))+'</span></div></div></div></div>';
}
function groupTasks(tasks){
  const td=today(),tm=addDays(td,1),wk=addDays(td,7),sort=S.settings.sort;
  const cmp=(a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||(b.star?1:0)-(a.star?1:0)||(a.time||'99:99').localeCompare(b.time||'99:99')||b.priority-a.priority||a.created-b.created;
  if(ui.view==='done'){
    const arr=tasks.slice().sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)),g={},order=[];
    arr.forEach(t=>{const d=ymd(new Date(t.doneAt||t.created));if(!g[d]){g[d]=[];order.push(d)}g[d].push(t)});
    return order.map(d=>({key:'dn'+d,label:dayLabel(d),tasks:g[d]}));
  }
  if(!tasks.length)return [];
  if(sort==='title')return [{key:'all',label:null,tasks:tasks.slice().sort((a,b)=>a.title.localeCompare(b.title))}];
  if(sort==='priority')return [3,2,1,0].map(p=>({key:'p'+p,label:PNAME[p],tasks:tasks.filter(t=>t.priority===p).sort(cmp)})).filter(g=>g.tasks.length);
  const s=tasks.slice().sort(cmp),out=[];
  const push=(key,label,fn,color)=>{const a=s.filter(fn);if(a.length)out.push({key,label,color,tasks:a})};
  push('overdue','Overdue',t=>t.due&&t.due<td,'var(--p3)');
  push('today','Today',t=>t.due===td);
  push('tomorrow','Tomorrow',t=>t.due===tm);
  if(ui.view==='week'){
    [...new Set(s.filter(t=>t.due>tm).map(t=>t.due))].forEach(d=>push('d'+d,parseYmd(d).toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'}),t=>t.due===d));
  }else{
    push('next7','Next 7 Days',t=>t.due>tm&&t.due<=wk);
    push('later','Later',t=>t.due>wk);
  }
  push('nodate','No date',t=>!t.due);
  return out;
}

function matrixHTML(tasks){
  const td=today(),soon=addDays(td,2);
  const urgent=t=>t.due&&t.due<=soon,imp=t=>t.priority>=2||t.star;
  const Q=[['Do first','Urgent · important','var(--p3)',t=>imp(t)&&urgent(t)],['Schedule','Important · not urgent','var(--primary)',t=>imp(t)&&!urgent(t)],['Quick wins','Urgent · not important','var(--p2)',t=>!imp(t)&&urgent(t)],['Someday','Neither','var(--sub)',t=>!imp(t)&&!urgent(t)]];
  const cmp=(a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||b.priority-a.priority;

function remainingSec(){const T=S.timer;if(T.mode==='stopwatch')return swElapsed();return T.running?Math.max(0,Math.round((T.endsAt-Date.now())/1000)):T.remaining}

const Amb={ctx:null,src:null,cur:'',nodes:[],
  stop(){try{this.src&&this.src.stop()}catch(e){}this.nodes.forEach(n=>{try{n.disconnect()}catch(e){}});this.nodes=[];this.src=null;this.cur=''},
  play(kind){
    this.stop();if(!kind)return;
    try{
      const c=this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)();if(c.state==='suspended')c.resume();
      const len=c.sampleRate*3,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);let last=0;
      for(let i=0;i<len;i++){const w=Math.random()*2-1;if(kind==='brown'||kind==='ocean'){last=(last+0.02*w)/1.02;d[i]=last*3.5}else d[i]=w*.5}
      const src=c.createBufferSource();src.buffer=buf;src.loop=true;
      const g=c.createGain();g.gain.value=kind==='white'?.18:kind==='rain'?.35:.5;
      let chain=src;const add=n=>{chain.connect(n);chain=n;this.nodes.push(n)};
      if(kind==='rain'){const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=900;add(hp);const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=9000;add(lp)}
      if(kind==='ocean'){const o=c.createOscillator(),og=c.createGain();o.frequency.value=.09;og.gain.value=.3;o.connect(og);og.connect(g.gain);o.start();this.nodes.push(o,og);g.gain.value=.55}
      add(g);g.connect(c.destination);src.start();this.src=src;this.cur=kind;this.nodes.push(src);
    }catch(e){toast('Sound is not available here')}
  }
};

/* ============ habits ============ */
const hv=(h,d)=>{const v=h.log[d];return v===true?1:(+v||0)};
const hdone=(h,d)=>hv(h,d)>=(h.target||1);
const hsched=(h,d)=>h.freq==='days'?h.days.includes(parseYmd(d).getDay()):true;
function weekKey(d){const off=(parseYmd(d).getDay()-S.settings.weekStart+7)%7;return addDays(d,-off)}
function weekCount(h,wk){let n=0;for(let i=0;i<7;i++)if(hdone(h,addDays(wk,i)))n++;return n}
function habitStreak(h){
  const td=today();
  if(h.freq==='week'){let wk=weekKey(td),n=0;if(weekCount(h,wk)<h.weekTarget)wk=addDays(wk,-7);while(weekCount(h,wk)>=h.weekTarget&&n<520){n++;wk=addDays(wk,-7)}return n}
  let d=td,n=0,g=0;
  if(hsched(h,d)&&!hdone(h,d))d=addDays(d,-1);
  while(g++<3000){if(!hsched(h,d)){d=addDays(d,-1);continue}if(hdone(h,d)){n++;d=addDays(d,-1)}else break}
  return n;
}
function bestStreak(h){
  let best=0,cur=0;
  if(h.freq==='week'){const first=weekKey(addDays(today(),-364));for(let i=0;i<53;i++){if(weekCount(h,addDays(first,i*7))>=h.weekTarget){cur++;best=Math.max(best,cur)}else cur=0}return best}
  for(let i=730;i>=0;i--){const d=addDays(today(),-i);if(!hsched(h,d))continue;if(hdone(h,d)){cur++;best=Math.max(best,cur)}else if(d!==today())cur=0}
  return best;
}
function habitRate(h,days=30){
  let s=0,n=0;for(let i=0;i<days;i++){const d=addDays(today(),-i);if(h.freq==='week'){if(hdone(h,d))n++}else if(hsched(h,d)){s++;if(hdone(h,d))n++}}
  if(h.freq==='week')return Math.min(100,Math.round(n/(h.weekTarget*days/7)*100));
  return s?Math.round(n/s*100):0;
}
function cycleHabit(h,d){
  const t=h.target||1,v=hv(h,d);
  const nv=t>1?(v>=t?0:v+1):(v?0:1);
  if(nv)h.log[d]=nv;else delete h.log[d];
  if(nv>=t&&nv>v){vib(15);if(d===today()&&habitsAllDone())confetti()}
  save();
}
const habitsAllDone=()=>S.habits.length>0&&S.habits.every(h=>!hsched(h,today())||hdone(h,today()));
const hunit=h=>h.freq==='week'?'week':'day';
function habitSub(h){
  const n=habitStreak(h),td=today(),t=h.target||1;
  const parts=[];
  if(n)parts.push('🔥 '+n+' '+hunit(h)+(n>1?'s':''));
  if(t>1)parts.push(hv(h,td)+'/'+t+(h.unit?' '+h.unit:''));
  if(h.freq==='week')parts.push(weekCount(h,weekKey(td))+'/'+h.weekTarget+' this week');
  else if(h.freq==='days')parts.push(h.days.map(i=>DOW[i][0]).join(' '));
  return parts.join(' · ')||'Not started';
}

function logByDay(){const m={};S.log.forEach(l=>{const d=ymd(new Date(l.ts));m[d]=(m[d]||0)+1});return m}
function totalXP(){return S.log.reduce((a,l)=>a+10+5*(l.pr||0),0)+S.focusLog.reduce((a,l)=>a+Math.round(l.mins/2),0)}
const levelOf=xp=>Math.floor(Math.sqrt(xp/40))+1;
const LV_TITLES=['Rookie','Starter','Doer','Go-getter','Achiever','Pro','Expert','Master','Grandmaster','Legend'];
function goalStreak(){const m=logByDay(),g=S.settings.dailyGoal;let d=today();if((m[d]||0)<g)d=addDays(d,-1);let n=0;while((m[d]||0)>=g&&n<3000){n++;d=addDays(d,-1)}return n}

  const weekDone=days.reduce((a,d)=>a+(by[d]||0),0);
  const focusTotal=S.focusLog.reduce((a,l)=>a+l.mins,0);
  const overdue=S.tasks.filter(isLate).length,open=S.tasks.filter(t=>!t.done).length;
  const gp=Math.min(1,n/goal),R=34,C=2*Math.PI*R;

  const lc={};S.log.filter(l=>l.ts>Date.now()-30*864e5).forEach(l=>{lc[l.l]=(lc[l.l]||0)+1});
  const lrows=Object.entries(lc).sort((a,b)=>b[1]-a[1]).slice(0,6),lmax=lrows.length?lrows[0][1]:1;
  const hbBest=S.habits.reduce((a,h)=>Math.max(a,bestStreak(h)),0);
  const ACH=[['🌱','First task',S.log.length>=1],['✅','10 tasks',S.log.length>=10],['🏅','100 tasks',S.log.length>=100],['🏆','500 tasks',S.log.length>=500],['🔥','3-day goal streak',goalStreak()>=3],['⚡','7-day goal streak',goalStreak()>=7],['🍅','10 focus sessions',S.focusLog.length>=10],['🧠','10 hours focused',focusTotal>=600],['📆','7-day habit streak',hbBest>=7],['🌟','Level 5',lv>=5]];
  $('#main').innerHTML=
   '<div class="in-card"><div class="lvl"><div class="badge">'+lv+'</div><div class="info"><b>'+LV_TITLES[Math.min(LV_TITLES.length-1,Math.floor((lv-1)/2))]+'</b><span>'+xp+' XP · '+(hi-xp)+' to level '+(lv+1)+'</span><div class="pr"><i style="width:'+pct+'%"></i></div></div></div></div>'
  +'<div class="in-card"><h4>Daily goal</h4><div class="goalrow"><svg viewBox="0 0 84 84"><circle class="gbg" cx="42" cy="42" r="'+R+'"/><circle class="gfg" cx="42" cy="42" r="'+R+'" stroke-dasharray="'+C+'" stroke-dashoffset="'+C*(1-gp)+'"/></svg><div><b>'+n+' / '+goal+'</b><span>tasks completed today</span><br><span>🔥 '+goalStreak()+'-day goal streak</span></div></div></div>'
  +'<div class="kpis"><div><b>'+S.log.length+'</b><span>Tasks completed</span></div><div><b>'+weekDone+'</b><span>Done this week</span></div><div><b>'+Math.round(focusTotal/6)/10+'h</b><span>Total focus time</span></div><div><b>'+open+(overdue?' · '+overdue+' late':'')+'</b><span>Open tasks</span></div></div>'
  +'<div class="in-card"><h4>Last 7 days</h4><div class="bars">'+days.map(d=>{const c=by[d]||0;return '<div class="'+(c?'':'z')+'"><span>'+(c||'')+'</span><i style="height:'+Math.max(4,Math.round(c/mx*52))+'px"></i>'+parseYmd(d).toLocaleDateString([],{weekday:'narrow'})+'</div>'}).join('')+'</div></div>'
  +'<div class="in-card"><h4>Focus minutes</h4><div class="bars">'+fs.days.map(d=>{const c=fs.mins[d];return '<div class="'+(c?'':'z')+'"><span>'+(c||'')+'</span><i style="height:'+Math.max(4,Math.round(c/fmx*52))+'px"></i>'+parseYmd(d).toLocaleDateString([],{weekday:'narrow'})+'</div>'}).join('')+'</div></div>'
  +'<div class="in-card"><h4>Activity · 12 weeks</h4><div class="heat">'+heat+'</div></div>'
  +(lrows.length?'<div class="in-card"><h4>Where your effort goes · 30 days</h4>'+lrows.map(([id,c])=>{const l=getList(id);return '<div class="lb"><span>'+esc(l?l.name:'Deleted list')+'</span><div class="tr"><i style="width:'+Math.round(c/lmax*100)+'%;background:'+(l?l.color:'var(--p0)')+'"></i></div><em>'+c+'</em></div>'}).join('')+'</div>':'')

/* ============ task operations ============ */
function replaceTask(snap){const i=S.tasks.findIndex(t=>t.id===snap.id);if(i>=0)S.tasks[i]=snap;else S.tasks.push(snap)}
function logDone(t){const k=uid();S.log.push({k,tid:t.id,ts:Date.now(),pr:t.priority,l:t.listId});if(S.log.length>6000)S.log.splice(0,S.log.length-6000);return k}
function unlogTask(id){for(let i=S.log.length-1;i>=0;i--)if(S.log[i].tid===id){S.log.splice(i,1);return}}
function toggleTask(id,quiet){
  const t=getTask(id);if(!t)return;
  const snap=clone(t);
  if(!t.done){
    const xp0=totalXP(),k=logDone(t);
    const undo=()=>{replaceTask(snap);S.log=S.log.filter(l=>l.k!==k);save();renderMain()};
    if(t.repeat){t.due=nextDue(t.due||today(),t.repeat);t.subtasks.forEach(s=>s.done=false);t.rem=null;t.snooze=0;if(!quiet)toast('Done · next '+dueText(t),'Undo',undo)}
    else{t.done=true;t.doneAt=Date.now();if(!quiet)toast('Completed · +'+(10+5*t.priority)+' XP','Undo',undo)}
    if(!quiet){
      vib(14);
      const n=logByDay()[today()]||0;
      if(levelOf(totalXP())>levelOf(xp0)){confetti();toast('🎉 Level '+levelOf(totalXP())+' reached!')}
      else if(n===S.settings.dailyGoal){confetti();toast('🎯 Daily goal reached!')}
    }
  }else{t.done=false;t.doneAt=null;unlogTask(id)}
  save();if(!quiet)renderMain();
}
function addTask(o){const t=mkTask(o.title,o);S.tasks.push(t);save();return t}
function trashTasks(ids,msg){
  const snaps=[];
  ids.forEach(id=>{const t=getTask(id);if(t){snaps.push(clone(t));const c=clone(t);c.deletedAt=Date.now();S.trash.push(c)}});
  S.tasks=S.tasks.filter(t=>!ids.includes(t.id));save();renderMain();
  toast(msg||(snaps.length>1?snaps.length+' tasks deleted':'Task deleted'),'Undo',()=>{S.trash=S.trash.filter(x=>!ids.includes(x.id));snaps.forEach(s=>S.tasks.push(s));save();renderMain()});
}
const deleteTask=id=>trashTasks([id]);
function defaultsForView(){
  const o={listId:'inbox',tags:[],due:null};
  if(ui.tab==='calendar'){o.due=ui.calSel;return o}
  const v=ui.view;
  if(v==='today'||v==='week')o.due=today();
  else if(v==='tomorrow')o.due=addDays(today(),1);
  else if(v.startsWith('list:')&&getList(v.slice(5)))o.listId=v.slice(5);
  else if(v.startsWith('tag:'))o.tags=[v.slice(4)];
  return o;
}

function resolveQA(){
  const q=ui.qa,txt=($('#qa-text')||{}).value||'',p=parseQuick(txt),d=q.def;
  const due=q.due||p.due||d.due||null,time=q.time||p.time||null;
  const priority=q.priority!=null?q.priority:(p.priority!=null?p.priority:0);
  const tags=[...new Set([...(d.tags||[]),...p.tags])];
  return {title:p.title,due,time,priority,tags,listId:q.listId||p.listId||d.listId,repeat:q.repeat!=null?q.repeat:p.repeat,dur:q.dur!=null?(q.dur||null):p.dur};
}
function refreshQA(){
  if(!ui.qa||!$('#qa-text'))return;
  const r=resolveQA();
  $('#qa-datel').textContent=r.due?dayLabel(r.due)+(r.time?' '+fmtTime(r.time):''):'Date';
  $('#qa-datep').classList.toggle('on',!!r.due);
  const pb=$('#qa-prio');pb.classList.toggle('on',r.priority>0);pb.querySelector('span').textContent=r.priority?PNAME[r.priority]:'Priority';
  pb.style.color=r.priority?PCOL[r.priority]:'';
  const l=getList(r.listId)||S.lists[0];$('#qa-listl').textContent=l.name;$('#qa-listdot').style.background=l.color;$('#qa-list').value=l.id;
  const dv=$('#qa-date');if(dv)dv.value=r.due||'';
  $('#qa-repl').textContent=r.repeat?repLabel(r.repeat).replace('Every ','↻ '):'Repeat';$('#qa-repp').classList.toggle('on',!!r.repeat);
  const rs=$('#qa-rep');if(rs){if(r.repeat&&!REPEATS.some(x=>x[0]===r.repeat)&&!rs.querySelector('option[value="'+r.repeat+'"]')){const o=document.createElement('option');o.value=r.repeat;o.textContent=repLabel(r.repeat);rs.appendChild(o)}rs.value=r.repeat||''}
  $('#qa-durl').textContent=r.dur?durText(r.dur):'Duration';$('#qa-durp').classList.toggle('on',!!r.dur);
  const ds=$('#qa-dur');if(ds){if(r.dur&&!DURS.includes(r.dur)&&!ds.querySelector('option[value="'+r.dur+'"]')){const o=document.createElement('option');o.value=r.dur;o.textContent=durText(r.dur);ds.appendChild(o)}ds.value=r.dur||0}
  $$('#qa-quick .chip').forEach(c=>c.classList.toggle('on',r.due===addDays(today(),+c.dataset.n)));
  const bits=[];if(r.tags.length)bits.push(r.tags.map(g=>'#'+g).join(' '));if(r.time&&!ui.qa.time)bits.push(fmtTime(r.time));
  const h=$('#qa-hint');if(h)h.innerHTML=bits.length&&($('#qa-text').value||'').trim()?'Detected: <b>'+esc(bits.join(' · '))+'</b>':'Try: “Gym every mon wed 6pm for 45m !high #health”';
}
function commitQA(){
  const r=resolveQA();
  if(!r.title){const t=$('#qa-text');if(t)t.focus();return}
  if(ui.rec){try{ui.rec.stop()}catch(e){}}
  addTask(r);hideLayer('L1');ui.qa=null;vib(10);
  const l=getList(r.listId);
  toast('Added to '+(l?l.name:'Inbox')+(r.due?' · '+dayLabel(r.due):''));
  renderMain();
}
function voiceInput(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Voice input is not supported in this browser');return}
  if(ui.rec){try{ui.rec.stop()}catch(e){}return}
  const r=new SR();r.lang=navigator.language||'en-US';r.interimResults=true;ui.rec=r;
  const mic=$('#qa-mic');if(mic)mic.classList.add('rec');
  const base=($('#qa-text')||{}).value||'';
  r.onresult=e=>{let s='';for(const x of e.results)s+=x[0].transcript;const t=$('#qa-text');if(t){t.value=(base?base+' ':'')+s;refreshQA()}};
  r.onend=()=>{ui.rec=null;const m=$('#qa-mic');if(m)m.classList.remove('rec')};
  r.onerror=()=>{toast('Could not hear you. Check the microphone permission.')};
  try{r.start()}catch(e){ui.rec=null}
}

let ac=null,swReg=null,installEv=null;
function beep(n=3){
  if(!S.settings.sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<n;i++){const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;const t=ac.currentTime+i*.28;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.start(t);o.stop(t+.25)}}catch(e){}
}
function sysNotify(title,body,tag){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    const o={body,icon:'icon-192.png',badge:'icon-192.png',tag:tag||'doable',vibrate:[200,100,200],renotify:true};
    if(swReg&&swReg.showNotification)swReg.showNotification(title,o);else new Notification(title,o);
  }catch(e){}
}
function alertUser(title,body){beep();vib([200,100,200]);if(document.hidden)sysNotify(title,body)}
function ensureNotifyPermission(){try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}
function reminderPopup(t){
  if($('#L3').classList.contains('on')){toast('⏰ '+t.title,'Open',()=>openDetail(t.id),12000);return}
  dialog({title:'⏰ '+t.title,body:'<p>'+esc(t.due?dueText(t):'Reminder')+'</p>',ok:'Complete',cancel:'Snooze 10 min',onOk:()=>{toggleTask(t.id)},onCancel:()=>{t.snooze=Date.now()+600000;save()}});
}
function checkReminders(){
  const now=Date.now();let ch=false;
  S.tasks.forEach(t=>{
    if(t.done||t.remind==null||!t.due)return;
    if(t.snooze&&now>=t.snooze){t.snooze=0;ch=true;alertUser('Reminder',t.title);reminderPopup(t);return}
    const at=parseYmd(t.due);const [h,m]=(t.time||'09:00').split(':').map(Number);at.setHours(h,m,0,0);
    const fire=at.getTime()-t.remind*60000;const key=t.due+'T'+(t.time||'09:00')+'/'+t.remind;
    if(now>=fire&&now-fire<12*3600e3&&t.rem!==key){
      t.rem=key;ch=true;alertUser('Reminder',t.title);reminderPopup(t);
    }
  });
  if(ch)save();
}
let tickN=0;
function tick(){
  if(!S)return;
  if(S.timer.running&&S.timer.mode!=='stopwatch'){if(remainingSec()<=0)finishTimer();else updateTimerDom()}
  else if(S.timer.running)updateTimerDom();
  if(++tickN%10===0)checkReminders();
}

let pinBuf='';
function hashPin(p){let h1=0xdeadbeef,h2=0x41c6ce57;const s='doable|'+p;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}

    const t=getTask(ui.detailId);if(!t)return;
    openMenu('',[
      {t:'Duplicate',ic:'copy',on:()=>{const c=clone(t);c.id=uid();c.created=Date.now();c.done=false;c.doneAt=null;c.rem=null;c.title+=' (copy)';S.tasks.push(c);save();closeDetail();toast('Task duplicated')}},
      {t:'Delete task',ic:'trash',cls:'danger',on:()=>A['d-delete']()}
    ]);
  },
  'd-delete'(){const id=ui.detailId;ui.detailId=null;hideLayer('L1');deleteTask(id)},
  'd-day'(el){
    const t=getTask(ui.detailId),n=+el.dataset.n;
    if(n<0){t.due=null;t.time=null;t.remind=null;t.repeat=''}else t.due=addDays(today(),n);
    dTouch(true);
  },
  'd-prio'(el){getTask(ui.detailId).priority=+el.dataset.p;dTouch(true)},
  'd-tag-x'(el){const t=getTask(ui.detailId);t.tags=t.tags.filter(g=>g!==el.dataset.g);dTouch(true)},
  'd-tag-add'(el){const t=getTask(ui.detailId);if(!t.tags.includes(el.dataset.g))t.tags.push(el.dataset.g);dTouch(true)},
  'd-sub-toggle'(el){const s=getTask(ui.detailId).subtasks.find(x=>x.id===el.dataset.s);if(s){s.done=!s.done;dTouch(true)}},
  'd-sub-del'(el){const t=getTask(ui.detailId);t.subtasks=t.subtasks.filter(x=>x.id!==el.dataset.s);dTouch(true)},
  'cr-day'(el){const i=+el.dataset.i,d=ui.tmp.days,k=d.indexOf(i);if(k>=0)d.splice(k,1);else d.push(i);el.classList.toggle('on',k<0)},
  /* calendar */
  'cal-sel'(el){ui.calSel=el.dataset.d;const d=parseYmd(ui.calSel);if(d.getMonth()!==ui.calMonth.getMonth()){ui.calMonth=new Date(d.getFullYear(),d.getMonth(),1);renderHeader()}renderMain()},
  'cal-prev'(){calMove(-1)},
  'cal-next'(){calMove(1)},
  'cal-today'(){ui.calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);ui.calSel=today();ui.tlScroll=true;renderHeader();renderMain()},
  'cal-mode'(){ui.calMode=ui.calMode==='day'?'month':'day';ui.tlScroll=true;if(ui.calMode==='month'){const d=parseYmd(ui.calSel);ui.calMonth=new Date(d.getFullYear(),d.getMonth(),1)}renderHeader();renderMain()},
  'tl-add'(el,e){
    const r=el.getBoundingClientRect();let m=Math.floor((e.clientY-r.top)/TLH*60/15)*15;m=Math.max(0,Math.min(23*60+45,m));
    openAdd({due:ui.calSel,time:fromMin(m)});
  },
  /* focus */
  'f-mode'(el){setMode(el.dataset.m);renderMain()},
  'f-toggle'(){if(S.timer.running)pauseTimer();else startTimer();renderMain()},
  'f-reset'(){const T=S.timer;T.running=false;T.acc=0;T.remaining=durOf(T.mode)*60;lockScreen(false);save();renderMain()},
  'f-skip'(){
    const T=S.timer;
    if(T.mode==='stopwatch'){const m=Math.floor(swElapsed()/60);if(m>=1){logFocus(m);toast('Logged '+m+' min of focus')}else toast('Run at least a minute to log it');T.running=false;T.acc=0;lockScreen(false);save();renderMain();return}
    const every=S.settings.focus.every||4;
    const next=T.mode==='focus'?(((T.cycle||0)+1)%every===0?'long':'short'):'focus';if(T.mode==='focus')T.cycle=(T.cycle||0)+1;setMode(next);renderMain();
  },
  amb(el){const k=el.dataset.k;Amb.play(Amb.cur===k?'':k);S.settings.ambient=Amb.cur;save();renderMain()},
  'focus-settings'(){focusSettingsDialog()},
  'fs-auto'(el){el.classList.toggle('on')},
  /* habits */
  'habit-add'(){habitDialog(null)},
  'habit-toggle'(el){const h=S.habits.find(x=>x.id===el.dataset.id);if(!h)return;cycleHabit(h,el.dataset.d);renderMain()},
  'habit-open'(el){openHabit(el.dataset.id)},
  'hd-close'(){hideLayer('LS');ui.hd=null},
  'hd-prev'(){const m=ui.hd.month;ui.hd.month=new Date(m.getFullYear(),m.getMonth()-1,1);redrawHabit()},
  'hd-next'(){const m=ui.hd.month;ui.hd.month=new Date(m.getFullYear(),m.getMonth()+1,1);redrawHabit()},
  'hd-day'(el){const h=S.habits.find(x=>x.id===ui.hd.id);if(!h)return;cycleHabit(h,el.dataset.d);redrawHabit();renderMain()},
  'hd-menu'(){
    const h=S.habits.find(x=>x.id===ui.hd.id);if(!h)return;
    openMenu(h.name,[
      {t:'Edit habit',ic:'edit',on:()=>habitDialog(h)},
      {t:'Delete habit',ic:'trash',cls:'danger',on:()=>confirmBox('Delete “'+h.name+'”?','Its history will be removed.','Delete',()=>{S.habits=S.habits.filter(x=>x.id!==h.id);save();hideLayer('LS');ui.hd=null;renderMain()})}
    ]);
  },
  'hb-freq'(el){ui.tmp.freq=el.dataset.f;$$('#hb-freq button').forEach(b=>b.classList.toggle('on',b===el));$('#hb-days').hidden=ui.tmp.freq!=='days';$('#hb-wk').hidden=ui.tmp.freq!=='week'},
  'hb-day'(el){const i=+el.dataset.i,d=ui.tmp.days,k=d.indexOf(i);if(k>=0)d.splice(k,1);else d.push(i);el.classList.toggle('on',k<0)},
  /* selection */
  'sel-exit'(){exitSel()},
  'sel-all'(){const ids=$$('.task[data-id]').map(r=>r.dataset.id).filter(id=>getTask(id));ids.forEach(id=>ui.sel.add(id));render()},
  'sel-done'(){const ids=selIds();ids.forEach(id=>{const t=getTask(id);if(t&&!t.done)toggleTask(id,true)});exitSel();toast(ids.length+' completed');vib(15)},
  'sel-date'(){
    const set=d=>()=>bulk(t=>{t.due=d;if(!d){t.time=null}},'Dates updated');
    openMenu('Set date',[{t:'Today',ic:'sun',on:set(today())},{t:'Tomorrow',ic:'sunrise',on:set(addDays(today(),1))},{t:'Next week',ic:'week',on:set(addDays(today(),7))},{t:'No date',ic:'x',on:set(null)}]);
  },
  'sel-prio'(){openMenu('Set priority',[3,2,1,0].map(p=>({t:PNAME[p],ic:'flag',on:()=>bulk(t=>{t.priority=p},'Priority updated')})))},
  'sel-move'(){openMenu('Move to list',S.lists.map(l=>({t:l.name,ic:l.id==='inbox'?'inbox':'list',on:()=>bulk(t=>{t.listId=l.id},'Moved to '+l.name)})))},
  'sel-del'(){const ids=selIds();exitSel();trashTasks(ids)},
  /* settings */
  'open-settings'(){openSettings()},
  'set-close'(){hideLayer('LS')},
  'set-tog'(el){const k=el.dataset.k;S.settings[k]=!S.settings[k];save();redrawSettings();applyTheme();renderMain()},
  'set-seg'(el){
    const k=el.dataset.k,v=el.dataset.v;
    S.settings[k]=['fs','weekStart','dailyGoal'].includes(k)?Number(v):v;
    save();applyTheme();redrawSettings();renderHeader();renderMain();
  },
  'set-accent'(el){S.settings.accent=el.dataset.c;save();applyTheme();redrawSettings();renderMain()},
  goal(el){S.settings.dailyGoal=clampN(S.settings.dailyGoal+Number(el.dataset.n),1,30,3);save();redrawSettings();renderMain()},
  'set-pin'(){setPinDialog()},
  'rm-pin'(){confirmBox('Turn off app lock?','Anyone who opens the app will see your tasks.','Turn off',()=>{S.settings.pin='';save(true);redrawSettings()})},
  pin(el){
    const k=el.dataset.k;
    if(k==='del')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;
    if(pinBuf.length===4){
      if(hashPin(pinBuf)===S.settings.pin){$('#lock').hidden=true;$('#lock').innerHTML='';pinBuf='';vib(10);return}
      vib([80,60,80]);pinBuf='';drawLock(true);return;
    }
    drawLock();
  },
  notify(){
    try{Notification.requestPermission().then(p=>{toast(p==='granted'?'Reminders will pop up as notifications':'Notifications are blocked in your browser settings');redrawSettings()})}
    catch(e){toast('Notifications are not available here')}
  },
  install(){if(installEv){installEv.prompt();installEv=null;redrawSettings()}},
  export(){if(download('doable-backup-'+today()+'.json',JSON.stringify(S,null,2),'application/json'))toast('Backup downloaded')},
  'export-csv'(){exportCSV()},
  import(){$('#import-file').click()},
  reset(){confirmBox('Reset everything?','All tasks, lists, habits and stats will be deleted. Export a backup first if you might need them.','Reset',()=>{const pin=S.settings.pin;S=normalize(defaultState());S.settings.pin=pin;ui.view='today';ui.tab='tasks';save(true);hideLayer('LS');render()})}
};
function calMove(n){
  if(ui.calMode==='day'){ui.calSel=addDays(ui.calSel,n);ui.tlScroll=true;const d=parseYmd(ui.calSel);ui.calMonth=new Date(d.getFullYear(),d.getMonth(),1);renderHeader();renderMain();return}
  const m=ui.calMonth;ui.calMonth=new Date(m.getFullYear(),m.getMonth()+n,1);renderHeader();renderMain();
}
let swipeBound=false;
function bindCalSwipe(){
  if(swipeBound)return;swipeBound=true;
  let x0=null,y0=null;
  $('#main').addEventListener('touchstart',e=>{if(ui.tab!=='calendar'||ui.calMode!=='month'||!e.target.closest('#calgrid')){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  $('#main').addEventListener('touchend',e=>{
    if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)calMove(dx<0?1:-1);
  },{passive:true});
}

/* ============ gestures: swipe + long-press ============ */
function swipeMenu(id){
  const t=getTask(id);if(!t)return;
  const set=d=>()=>{t.due=d;if(!d)t.time=null;save();renderMain();toast(d?'Moved to '+dayLabel(d):'Date removed')};
  openMenu(t.title,[{t:'Today',ic:'sun',on:set(today())},{t:'Tomorrow',ic:'sunrise',on:set(addDays(today(),1))},{t:'Next week',ic:'week',on:set(addDays(today(),7))},{t:'No date',ic:'x',on:set(null)},{t:'Delete',ic:'trash',cls:'danger',on:()=>deleteTask(id)}]);
}
function bindGestures(){
  const m=$('#main');let g=null;
  const reset=()=>{if(g){clearTimeout(g.lp);if(g.tin){g.tin.classList.remove('drag');g.tin.style.transform=''}g=null}};
  m.addEventListener('touchstart',e=>{
    const row=e.target.closest('.task');
    if(!row||!getTask(row.dataset.id)||e.touches.length>1){g=null;return}
    const t=e.touches[0];
    g={tin:$('.tin',row),id:row.dataset.id,x:t.clientX,y:t.clientY,dx:0,mode:'',lp:setTimeout(()=>{if(g&&!g.mode){noClick=Date.now();const id=g.id;g=null;enterSel(id)}},480)};
  },{passive:true});
  m.addEventListener('touchmove',e=>{
    if(!g)return;const t=e.touches[0],dx=t.clientX-g.x,dy=t.clientY-g.y;
    if(!g.mode){
      if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){clearTimeout(g.lp);g=null;return}
      if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.3){clearTimeout(g.lp);g.mode='swipe';g.tin.classList.add('drag')}
      else return;
    }
    g.dx=dx;if(!ui.sel)g.tin.style.transform='translateX('+dx+'px)';
  },{passive:true});
  m.addEventListener('touchend',()=>{
    if(!g)return;clearTimeout(g.lp);
    if(g.mode==='swipe'){
      noClick=Date.now();const {dx,id}=g;g.tin.classList.remove('drag');g.tin.style.transform='';g=null;
      if(!ui.sel){if(dx>90){vib(10);toggleTask(id)}else if(dx<-90)swipeMenu(id)}
      return;
    }
    g=null;
  });
  m.addEventListener('touchcancel',reset);
  document.addEventListener('contextmenu',e=>{
    const row=e.target.closest('.task');
    if(row&&getTask(row.dataset.id)){e.preventDefault();if(Date.now()-noClick>700){noClick=Date.now();enterSel(row.dataset.id)}}
  });
}

/* ============ events ============ */
document.addEventListener('click',e=>{
  if(Date.now()-noClick<400)return;
  const el=e.target.closest('[data-act]');if(!el)return;
  const row=el.closest('.task');
  if(ui.sel&&row&&(el.dataset.act==='open'||el.dataset.act==='toggle')){toggleSel(row.dataset.id);return}
  const fn=A[el.dataset.act];if(fn)fn(el,e);
});
document.addEventListener('input',e=>{
  const t=e.target,id=t.id;
  if(id==='sq'){ui.q=t.value;renderMain()}
  else if(id==='qa-text')refreshQA();
  else if(ui.detailId&&getTask(ui.detailId)){
    const task=getTask(ui.detailId);
    if(id==='d-title'){task.title=t.value;autosize(t);save()}
    else if(id==='d-notes'){task.notes=t.value;save()}
    else if(t.classList.contains('sub-t')&&t.dataset.s){const s=task.subtasks.find(x=>x.id===t.dataset.s);if(s){s.t=t.value;save()}}
  }
});
document.addEventListener('change',e=>{
  const t=e.target,id=t.id;
  if(id==='qa-date'){ui.qa.due=t.value||null;refreshQA();return}
  if(id==='qa-list'){ui.qa.listId=t.value;refreshQA();return}
  if(id==='qa-rep'){ui.qa.repeat=t.value;refreshQA();return}
  if(id==='qa-dur'){ui.qa.dur=+t.value;refreshQA();return}
  if(id==='f-task'){S.timer.taskId=t.value;save();return}
  if(id==='import-file'){
    const f=t.files&&t.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tasks||!d.lists)throw 0;const pin=S.settings.pin;S=normalize(d);if(pin)S.settings.pin=pin;save(true);closeDrawer();hideLayer('LS');render();toast('Backup restored')}catch(x){toast('That file is not a Doable backup')}};
    r.readAsText(f);t.value='';return;
  }
  if(!ui.detailId)return;const task=getTask(ui.detailId);if(!task)return;
  const syncDate=()=>{const d=$('#d-date');if(d)d.value=task.due||''};
  if(id==='d-date'){task.due=t.value||null;if(!t.value){task.time=null;task.remind=null;task.repeat=''}dTouch(false);redrawDetail()}
  else if(id==='d-time'){task.time=t.value||null;if(t.value&&!task.due){task.due=today();syncDate()}dTouch(false)}
  else if(id==='d-repeat'){
    if(t.value==='__custom'){customRepeat(task);return}
    task.repeat=t.value;if(t.value&&!task.due){task.due=today();syncDate()}dTouch(false)}
  else if(id==='d-remind'){task.remind=t.value===''?null:+t.value;task.rem=null;task.snooze=0;if(task.remind!=null&&!task.due){task.due=today();syncDate()}dTouch(false)}
  else if(id==='d-dur'){task.dur=+t.value||null;dTouch(false)}
  else if(id==='d-list'){task.listId=t.value;dTouch(false)}
});
document.addEventListener('keydown',e=>{
  const t=e.target,id=t.id;
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){
    if(id==='qa'){
      e.preventDefault();const text=t.value.trim();if(!text)return;
      const p=parseQuick(text),d=defaultsForView();
      if(!p.title)return;
      addTask({title:p.title,due:p.due||d.due,time:p.time,priority:p.priority||0,tags:[...new Set([...d.tags,...p.tags])],listId:p.listId||d.listId,repeat:p.repeat,dur:p.dur});
      t.value='';renderMain();const q=$('#qa');if(q)q.focus();
    }
    else if(id==='qa-text'){e.preventDefault();commitQA()}
    else if(id==='d-title'){e.preventDefault();t.blur()}
    else if(id==='d-tag'){
      e.preventDefault();const g=t.value.trim().replace(/^#/,'').toLowerCase().replace(/\s+/g,'-');
      if(g){const task=getTask(ui.detailId);if(!task.tags.includes(g))task.tags.push(g);dTouch(false);redrawDetail('#d-tag')}
    }
    else if(id==='d-sub-new'){
      e.preventDefault();const v=t.value.trim();
      if(v){getTask(ui.detailId).subtasks.push({id:uid(),t:v,done:false});dTouch(false);redrawDetail('#d-sub-new')}
    }
    else if(t.classList&&t.classList.contains('sub-t')&&t.dataset.s){e.preventDefault();const n=$('#d-sub-new');if(n)n.focus()}
  }
  if(id==='sq'&&e.key==='Escape')A['search-close']();
});
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();if(S)save(true)}
  else if(S){
    if(S.settings.pin&&S.settings.autolock&&hiddenAt&&Date.now()-hiddenAt>20000&&$('#lock').hidden)showLock();
    tick();checkReminders();if(ui.tab!=='focus'&&ui.tab!=='habits'&&!ui.detailId&&!ui.qa)renderMain();
  }
});
window.addEventListener('pagehide',()=>{if(S)save(true)});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e});
window.addEventListener('appinstalled',()=>{installEv=null;toast('Doable installed')});
$('#import-file').addEventListener('click',e=>e.stopPropagation());

/* ============ init ============ */
(async function init(){
  let raw=await store.get(KEY),migrated=false;
  if(!raw){const old=await store.get(OLDKEY);if(old){raw=old;migrated=true}}
  try{S=raw?JSON.parse(raw):null}catch(e){S=null}
  if(!S||!Array.isArray(S.tasks)||!Array.isArray(S.lists))S=defaultState();
  S=normalize(S);
  if(migrated)save(true);
  try{if(navigator.storage&&navigator.storage.persist){ui.persisted=await navigator.storage.persist()}}catch(e){}
  if(S.settings.pin)showLock();
  $('#boot').remove();
  render();bindGestures();
  tick();checkReminders();
  setInterval(tick,1000);
  if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{});
  }
  const a=new URLSearchParams(location.search).get('a');
  if(a==='add')setTimeout(()=>openAdd(),150);
  else if(a==='focus'){ui.tab='focus';render()}
  else if(a==='habits'){ui.tab='habits';render()}
})();
})();
</script>
</body>
